<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Registry Keys</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c212b;
    --border: #2a3140;
    --text: #e6e9ef;
    --muted: #8b93a5;
    --accent: #6ea8fe;
    --tag: #f0b866;
    --chip-bg: #1b2029;
    --chip-hover: #242c3a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,17,21,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  header h1 { font-size: 17px; margin: 0 12px 0 0; font-weight: 650; }
  header h1 span { color: var(--accent); }
  select, input[type="search"] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    outline: none;
  }
  select:focus, input[type="search"]:focus { border-color: var(--accent); }
  select { cursor: pointer; font-weight: 600; }
  input[type="search"] { flex: 1; min-width: 180px; max-width: 420px; font-family: var(--mono); }
  #stats { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
  .layout { display: flex; max-width: 1400px; margin: 0 auto; }
  nav {
    position: sticky; top: 61px;
    align-self: flex-start;
    width: 250px; flex-shrink: 0;
    max-height: calc(100vh - 61px);
    overflow-y: auto;
    padding: 16px 8px 40px 16px;
  }
  nav a {
    display: flex; justify-content: space-between; gap: 8px;
    color: var(--muted); text-decoration: none;
    padding: 5px 10px; border-radius: 6px; font-size: 13.5px;
  }
  nav a:hover { background: var(--panel-2); color: var(--text); }
  nav a .n { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  main { flex: 1; min-width: 0; padding: 20px 20px 80px; }
  section.registry {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  section.registry h2 {
    margin: 0 0 4px; font-size: 17px;
    display: flex; align-items: baseline; gap: 10px;
  }
  section.registry h2 .counts { color: var(--muted); font-size: 12.5px; font-weight: 400; }
  h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 14px 0 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    color: var(--text);
    transition: background .1s;
  }
  .chip:hover { background: var(--chip-hover); border-color: var(--accent); }
  .chip.tag { color: var(--tag); }
  .chip.copied { border-color: #4cc38a; color: #4cc38a; }
  .hidden { display: none !important; }
  #empty { color: var(--muted); text-align: center; padding: 60px 0; }
  footer {
    color: var(--muted); font-size: 13px; text-align: center;
    padding: 24px; border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); }
  mark { background: #6ea8fe44; color: inherit; border-radius: 3px; padding: 0 1px; }
  @media (max-width: 800px) { nav { display: none; } }
</style>
</head>
<body>
<header>
  <h1><span>Paper</span> Registry Keys</h1>
  <label for="version" style="color:var(--muted);font-size:13px">Version</label>
  <select id="version" aria-label="Minecraft version"></select>
  <input id="search" type="search" placeholder="Filter keys… e.g. diamond_sword or #swords" aria-label="Filter keys">
  <span id="stats"></span>
</header>
<div class="layout">
  <nav id="nav" aria-label="Registries"></nav>
  <main>
    <div id="content"></div>
    <p id="empty" class="hidden">No keys match your filter.</p>
  </main>
</div>
<footer>
  Keys and tag keys generated from the <a id="branch-link" href="https://github.com/PaperMC/Paper" target="_blank" rel="noopener">PaperMC/Paper</a>
  source (paper-api generated registry key classes), per-version branch. Click any key to copy it.
</footer>
<script>
const DEFAULT_VERSION = "26.2"; // latest Minecraft version
let manifest = [];
let current = null;

const $ = id => document.getElementById(id);

async function init() {
  manifest = await (await fetch("data/versions.json")).json();
  const sel = $("version");
  for (const v of manifest) {
    const opt = document.createElement("option");
    opt.value = v.version;
    opt.textContent = v.version + (v.version === DEFAULT_VERSION ? " (latest)" : "");
    sel.appendChild(opt);
  }
  const fromHash = decodeURIComponent(location.hash.slice(1));
  sel.value = manifest.some(v => v.version === fromHash) ? fromHash : DEFAULT_VERSION;
  sel.addEventListener("change", () => {
    location.hash = sel.value;
    loadVersion(sel.value);
  });
  window.addEventListener("hashchange", () => {
    const v = decodeURIComponent(location.hash.slice(1));
    if (manifest.some(m => m.version === v) && v !== sel.value) {
      sel.value = v;
      loadVersion(v);
    }
  });
  $("search").addEventListener("input", applyFilter);
  loadVersion(sel.value);
}

async function loadVersion(version) {
  const entry = manifest.find(v => v.version === version);
  current = await (await fetch(entry.file)).json();
  document.title = `Paper Registry Keys — ${version}`;
  const link = $("branch-link");
  link.href = `https://github.com/PaperMC/Paper/tree/${current.branch}`;
  link.textContent = `PaperMC/Paper @ ${current.branch}`;
  render();
  applyFilter();
}

function chipHtml(key, isTag) {
  const text = isTag ? "#" + key : key;
  return `<button class="chip${isTag ? " tag" : ""}" data-k="${text}" title="Click to copy">${text}</button>`;
}

function render() {
  const nav = $("nav");
  const content = $("content");
  let navHtml = "", html = "";
  for (const reg of current.registries) {
    const total = reg.keys.length + reg.tagKeys.length;
    navHtml += `<a href="#${current.version}/${reg.id}" data-reg="${reg.id}">${reg.name}<span class="n">${total}</span></a>`;
    html += `<section class="registry" id="reg-${reg.id}" data-reg="${reg.id}">`;
    html += `<h2>${reg.name} <span class="counts">${reg.keys.length} keys · ${reg.tagKeys.length} tag keys</span></h2>`;
    if (reg.keys.length) {
      html += `<h3>Keys</h3><div class="chips">` + reg.keys.map(k => chipHtml(k, false)).join("") + `</div>`;
    }
    if (reg.tagKeys.length) {
      html += `<h3>Tag Keys</h3><div class="chips">` + reg.tagKeys.map(k => chipHtml(k, true)).join("") + `</div>`;
    }
    html += `</section>`;
  }
  nav.innerHTML = navHtml;
  content.innerHTML = html;
  // nav anchors: scroll to section without fighting the version hash router
  nav.querySelectorAll("a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    document.getElementById("reg-" + a.dataset.reg)?.scrollIntoView();
  }));
  content.addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    navigator.clipboard.writeText(chip.dataset.k).then(() => {
      chip.classList.add("copied");
      setTimeout(() => chip.classList.remove("copied"), 700);
    });
  });
  updateStats(
    current.registries.reduce((s, r) => s + r.keys.length, 0),
    current.registries.reduce((s, r) => s + r.tagKeys.length, 0)
  );
}

function updateStats(keys, tags) {
  $("stats").textContent = `${keys.toLocaleString()} keys · ${tags.toLocaleString()} tag keys`;
}

function applyFilter() {
  const q = $("search").value.trim().toLowerCase();
  let shownKeys = 0, shownTags = 0, anyShown = false;
  for (const sectionEl of document.querySelectorAll("section.registry")) {
    let sectionHas = false;
    for (const chip of sectionEl.querySelectorAll(".chip")) {
      const match = !q || chip.dataset.k.toLowerCase().includes(q);
      chip.classList.toggle("hidden", !match);
      if (match) {
        sectionHas = true;
        chip.classList.contains("tag") ? shownTags++ : shownKeys++;
      }
    }
    // hide key/tag group headers whose chip lists are fully filtered out
    sectionEl.querySelectorAll("h3").forEach(h => {
      const list = h.nextElementSibling;
      const hasVisible = list && list.querySelector(".chip:not(.hidden)");
      h.classList.toggle("hidden", !hasVisible);
      list?.classList.toggle("hidden", !hasVisible);
    });
    sectionEl.classList.toggle("hidden", !sectionHas);
    document.querySelector(`nav a[data-reg="${sectionEl.dataset.reg}"]`)
      ?.classList.toggle("hidden", !sectionHas);
    anyShown = anyShown || sectionHas;
  }
  $("empty").classList.toggle("hidden", anyShown);
  updateStats(shownKeys, shownTags);
}

init();
</script>
</body>
</html>
